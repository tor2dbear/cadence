<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadence — hero</title>
<meta name="description" content="A self-contained, text-free hero animation showcasing Cadence: the whole motion system as a fan of role-coloured easing curves, one lit at a time, with an orb riding the active one. Fixed 16:9 frame that scales like a video." />
<!--
  Cadence — standalone hero animation.

  ONE file, ZERO dependencies, no external requests at runtime — true to the
  product's own thesis ("one static page, no framework, no runtime"). Drop it in
  a portfolio hero band, <iframe> it, or lift the markup.

  VIDEO-LIKE, NOT RESPONSIVE: the whole composition lives inside a single SVG on
  a fixed 16:9 frame, so it scales UNIFORMLY (letterboxed) to any container — it
  never reflows or rearranges. Behaves like a <video>, not a responsive layout.

  What it shows (the tool's CORE, wordlessly): the whole motion system at once —
  the four semantic intents (enter · move · emphasized · exit) drawn as a fan of
  role-coloured easing curves. One lights up at a time; an orb rides that exact
  curve (comet trail + velocity-driven motion blur on a demo chip), a soft wash
  of its role colour breathes behind it, and springs are sampled to a linear()
  polyline just as Cadence exports them.

  Modes (via URL hash, combinable e.g. #light,label):
    • default   — text-free, dark
    • #light    — Cadence's light palette (parchment / ink-navy) instead of dark
    • #label    — reveal a minimal mono instrument caption (intent + tokens)

  prefers-reduced-motion falls back to a calm opacity-only cross-fade (no travel,
  comet or motion blur) rather than freezing.

  Palette is Cadence's own — dark #191712 / light #ece5d6, and the four fixed
  role colours (enter #8ad0c6 · move #e9b872 · emphasized #b79cf0 · exit #e08b7f).
-->
<style>
  :root{
    /* dark (default). --brand is Cadence's PRIMARY accent (dark: periwinkle);
       it carries the instrument chrome + readout, so the piece reads in the
       brand palette while the four role colours stay on the curves/orb. */
    --bg:#191712; --ink:#ece5d6; --ink-dim:#a79d8a; --ink-faint:#79705f;
    --brand:#8ea2e8; --on-brand:#191712;   /* on-brand = readable text on a brand fill */
    --line:rgba(142,162,232,.17); --line-2:rgba(142,162,232,.085);
    --faint:#7182b4; --vignette:rgba(142,162,232,.05);
    /* --role is swapped per intent by the driver; seed with enter */
    --role:#8ad0c6;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  body.light{
    --bg:#ece5d6; --ink:#211d15; --ink-dim:#655f51; --ink-faint:#9a9079;
    --brand:#22356e; --on-brand:#f6f1e6;              /* the signature navy */
    --line:rgba(34,53,110,.22); --line-2:rgba(34,53,110,.11);
    --faint:#3f4f86; --vignette:rgba(34,53,110,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    min-height:100svh;
    display:grid;
    place-items:center;      /* letterbox the fixed-ratio frame, like a video */
    overflow:hidden;
  }
  /* the "video": a fixed 16:9 frame that scales uniformly, never reflows */
  .frame{
    position:relative;
    aspect-ratio:16 / 9;
    width:min(100%, calc(100svh * 16 / 9));
    background:
      radial-gradient(120% 100% at 50% 44%,var(--vignette),transparent 60%),
      var(--bg);
    overflow:hidden;
  }
  .frame svg.plot{position:absolute;inset:0;width:100%;height:100%;display:block}
  #cap{font-family:var(--mono)}
  #cap text{letter-spacing:.01em}
</style>
</head>
<body>

<div class="frame">
  <svg class="plot" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <filter id="mblur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur id="mblurG" stdDeviation="0 0" />
      </filter>
      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.6" />
      </filter>
      <radialGradient id="orbGlow">
        <stop offset="0%" stop-color="var(--role)" stop-opacity=".6"/>
        <stop offset="100%" stop-color="var(--role)" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="wash" cx="50%" cy="46%" r="62%">
        <stop offset="0%" stop-color="var(--role)" stop-opacity=".16"/>
        <stop offset="55%" stop-color="var(--role)" stop-opacity=".045"/>
        <stop offset="100%" stop-color="var(--role)" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- breathing colour wash -->
    <rect id="washRect" x="0" y="0" width="320" height="180" fill="url(#wash)"/>

    <!-- faint grid + frame -->
    <g stroke="var(--line-2)" fill="none" stroke-width="1">
      <line x1="42" y1="140" x2="278" y2="140"/>
      <line x1="42" y1="52"  x2="42"  y2="140"/>
    </g>
    <g stroke="var(--line-2)" fill="none" stroke-width="1" stroke-dasharray="2 5">
      <line x1="42" y1="96" x2="278" y2="96"/>
      <line x1="160" y1="52" x2="160" y2="140"/>
    </g>

    <!-- the whole system: a fan of the four role-coloured intents (filled by JS) -->
    <g id="fan" fill="none" stroke-width="1.4" stroke-linecap="round"></g>

    <!-- demo track -->
    <line x1="42" y1="154" x2="278" y2="154" stroke="var(--line-2)" stroke-width="1"/>

    <!-- crosshair -->
    <g id="cross" stroke="var(--role)" stroke-width="1" opacity="0" stroke-dasharray="1 3">
      <line id="crossV" x1="42" y1="140" x2="42" y2="140"/>
      <line id="crossH" x1="42" y1="140" x2="42" y2="140"/>
    </g>

    <!-- control-point handles (cubic intents only) — the editing "levers" are
         part of the instrument, so they carry the PRIMARY brand colour -->
    <g id="handles" opacity="0">
      <line id="h1line" stroke="var(--brand)" stroke-width="1" opacity=".55"/>
      <line id="h2line" stroke="var(--brand)" stroke-width="1" opacity=".55"/>
      <circle id="h1dot" r="2.2" fill="var(--bg)" stroke="var(--brand)" stroke-width="1.3"/>
      <circle id="h2dot" r="2.2" fill="var(--bg)" stroke="var(--brand)" stroke-width="1.3"/>
    </g>

    <!-- active curve: bloomed underlay + crisp stroke -->
    <path id="curveGlow" fill="none" stroke="var(--role)" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round" opacity=".22" filter="url(#bloom)"/>
    <path id="curve" fill="none" stroke="var(--role)" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- demo chip -->
    <g filter="url(#mblur)">
      <rect id="chip" x="42" y="150" width="8" height="8" rx="2.2" fill="var(--role)"/>
    </g>

    <!-- orb + comet trail (trail circles created by JS) -->
    <g id="trail"></g>
    <circle id="orbGlowC" r="10" fill="url(#orbGlow)"/>
    <circle id="orb" r="3.8" fill="var(--role)"/>

    <!-- endpoint anchors -->
    <circle cx="42" cy="140" r="1.9" fill="var(--faint)"/>
    <circle cx="278" cy="52" r="1.9" fill="var(--faint)"/>

    <!-- instrument caption — JS fills it with token "chips" (tag/code feel);
         inside the SVG so it scales with everything else -->
    <g id="cap" opacity="0"></g>
  </svg>
</div>

<script>
(function(){
  "use strict";
  var NS="http://www.w3.org/2000/svg", $=function(id){return document.getElementById(id)};
  var hash=location.hash||"";
  if(/light/.test(hash)) document.body.classList.add("light");
  var showcap=/label/.test(hash);
  var LIGHT=document.body.classList.contains("light");
  // faint-fan opacity — the pale role hues need a touch more presence on light
  var INACT=LIGHT?0.26:0.12;
  // legible-on-parchment role colours for light (deepened, same hue family;
  // move/emphasized/exit align to the tool's own light accent-2 / violet / warn)
  var ROLE_LIGHT={enter:"#177f70",move:"#9a5e23",emphasized:"#6a4a86",exit:"#b0402a"};

  // ---- plot geometry (SVG user units, 320×180 = 16:9) -----------------
  // Y0 raised (was 150) to open a clear band at the bottom for the demo track,
  // chip and caption, so the "timeline" marker isn't crowded against the plot.
  var X0=42, X1=278, W=X1-X0, Y0=140, H=88;
  var CHIPW=8;   // demo-chip size; its edges align to X0/X1 at start/stop
  var xAt=function(t){return X0+t*W}, yAt=function(v){return Y0-v*H};

  // ---- easing maths ----------------------------------------------------
  function cubic(x1,y1,x2,y2){
    var bx=function(s){return 3*(1-s)*(1-s)*s*x1+3*(1-s)*s*s*x2+s*s*s;};
    var by=function(s){return 3*(1-s)*(1-s)*s*y1+3*(1-s)*s*s*y2+s*s*s;};
    return function(t){var lo=0,hi=1,s=t;for(var i=0;i<22;i++){s=(lo+hi)/2;(bx(s)<t)?lo=s:hi=s;}return by(s);};
  }
  function spring(k,c){ // damped oscillator, 0→1, sampled to a polyline (→ linear())
    var m=1, w0=Math.sqrt(k/m), zeta=c/(2*Math.sqrt(k*m)), WIN=0.92;
    var wd=w0*Math.sqrt(Math.max(1e-6,1-zeta*zeta));
    return function(t){var tt=t*WIN;
      if(zeta<1){return 1-Math.exp(-zeta*w0*tt)*(Math.cos(wd*tt)+(zeta*w0/wd)*Math.sin(wd*tt));}
      return 1-Math.exp(-w0*tt)*(1+w0*tt);};
  }

  // fixed role colours (same as the tool's INTENT_COLORS, both themes)
  var INTENTS=[
    {key:"enter", color:"#8ad0c6", comp:["duration.base","emphasized-decelerate"], val:"cubic-bezier(.05,.7,.1,1)", dur:280, ease:cubic(.05,.7,.1,1), h:[.05,.7,.1,1]},
    {key:"move", color:"#e9b872", comp:["duration.base","standard"], val:"cubic-bezier(.4,0,.2,1)", dur:320, ease:cubic(.4,0,.2,1), h:[.4,0,.2,1]},
    {key:"emphasized", color:"#b79cf0", comp:["duration.slow","anticipate · overshoot"], val:"cubic-bezier(.34,1.56,.64,1)", dur:360, ease:cubic(.34,1.56,.64,1), h:[.34,1.56,.64,1]},
    {key:"exit", color:"#e08b7f", comp:["duration.slow","spring → linear()"], val:"spring(stiffness 200 · damping 14)", dur:640, ease:spring(200,14), h:null}
  ];
  if(LIGHT) INTENTS.forEach(function(it){it.color=ROLE_LIGHT[it.key];});

  // pre-sample each intent → path string + total length (for the draw-on)
  var N=72;
  INTENTS.forEach(function(it){
    var d="", len=0, ppx, ppy;
    for(var i=0;i<=N;i++){
      var t=i/N, px=xAt(t), py=yAt(it.ease(t));
      d+=(i?"L":"M")+px.toFixed(2)+","+py.toFixed(2);
      if(i) len+=Math.hypot(px-ppx,py-ppy);
      ppx=px; ppy=py;
    }
    it.d=d; it.len=len;
  });

  // ---- the fan: the whole system at rest, drawn in the PRIMARY brand colour
  //      (only the active intent lights up in its role colour, below) ---------
  var fan=$("fan"), fanPaths=[];
  INTENTS.forEach(function(it){
    var p=document.createElementNS(NS,"path");
    p.setAttribute("d",it.d); p.setAttribute("stroke","var(--brand)"); p.setAttribute("opacity",String(INACT));
    fan.appendChild(p); fanPaths.push(p);
  });

  // ---- DOM handles -----------------------------------------------------
  var curve=$("curve"), curveGlow=$("curveGlow"), orb=$("orb"), orbGlow=$("orbGlowC"),
      chip=$("chip"), cross=$("cross"), crossV=$("crossV"), crossH=$("crossH"),
      handles=$("handles"), h1line=$("h1line"), h2line=$("h2line"), h1dot=$("h1dot"), h2dot=$("h2dot"),
      mblurG=$("mblurG"), washRect=$("washRect"), trail=$("trail"),
      cap=$("cap"), root=document.documentElement;

  if(showcap){ cap.style.transition="opacity .5s ease"; }

  // ---- token "chips" — the tag/code readout, laid out in SVG units -----
  function mkChip(text,fs,color,strong){
    var g=document.createElementNS(NS,"g"),
        r=document.createElementNS(NS,"rect"),
        t=document.createElementNS(NS,"text");
    t.setAttribute("font-size",fs); t.setAttribute("font-weight",strong?"700":"500");
    t.setAttribute("fill",color); t.setAttribute("dominant-baseline","central");
    t.textContent=text;
    r.setAttribute("fill",color); r.setAttribute("fill-opacity",strong?".12":".07");
    r.setAttribute("stroke",color); r.setAttribute("stroke-opacity",strong?".5":".32");
    r.setAttribute("stroke-width","0.5"); r.setAttribute("rx","2.2");
    g.appendChild(r); g.appendChild(t);
    return {g:g,r:r,t:t};
  }
  function placeChip(c,x,w,cy,h,padX){
    c.r.setAttribute("x",x); c.r.setAttribute("y",cy-h/2);
    c.r.setAttribute("width",w); c.r.setAttribute("height",h);
    c.t.setAttribute("x",x+padX); c.t.setAttribute("y",cy);
  }
  function buildCaption(it){
    while(cap.firstChild) cap.removeChild(cap.firstChild);
    var FS=5.2, padX=3, padY=2.3, gap=3.4, cy=170, h=FS+padY*2, x=X0;
    // intent chip — SOLID brand fill + a role-coloured dot (the tool's own
    // intent-dot convention): the tag reads primary, the dot keeps the role cue
    var ig=document.createElementNS(NS,"g"),
        ir=document.createElementNS(NS,"rect"),
        idot=document.createElementNS(NS,"circle"),
        itx=document.createElementNS(NS,"text");
    itx.setAttribute("font-size",FS); itx.setAttribute("font-weight","700");
    itx.setAttribute("fill","var(--on-brand)"); itx.setAttribute("dominant-baseline","central");
    itx.textContent=it.key;
    ig.appendChild(ir); ig.appendChild(idot); ig.appendChild(itx); cap.appendChild(ig);
    var tw=itx.getBBox().width, dotR=1.5, dotGap=2.6, iw=padX+dotR*2+dotGap+tw+padX;
    ir.setAttribute("x",x); ir.setAttribute("y",cy-h/2); ir.setAttribute("width",iw);
    ir.setAttribute("height",h); ir.setAttribute("rx","2.2"); ir.setAttribute("fill","var(--brand)");
    idot.setAttribute("cx",x+padX+dotR); idot.setAttribute("cy",cy); idot.setAttribute("r",dotR); idot.setAttribute("fill",it.color);
    itx.setAttribute("x",x+padX+dotR*2+dotGap); itx.setAttribute("y",cy);
    x+=iw+gap;
    // composition + duration — brand-outlined chips
    [it.comp[0],it.comp[1],it.dur+"ms"].forEach(function(txt,i){
      var c=mkChip(txt,FS,"var(--brand)",false); cap.appendChild(c.g);
      var w=c.t.getBBox().width+padX*2;
      if(i===2){ var dx=X1-w; placeChip(c,dx,w,cy,h,padX); }   // duration → right edge
      else { placeChip(c,x,w,cy,h,padX); x+=w+gap; }
    });
  }

  var TRAILN=18, trailC=[], hist=[];
  for(var i=0;i<TRAILN;i++){var c=document.createElementNS(NS,"circle");c.setAttribute("r","2.6");trail.appendChild(c);trailC.push(c);}


  function applyIntent(it,i){
    root.style.setProperty("--role",it.color);
    curve.setAttribute("d",it.d); curveGlow.setAttribute("d",it.d);
    curve.style.strokeDasharray=it.len+" "+it.len;
    curveGlow.style.strokeDasharray=it.len+" "+it.len;
    fanPaths.forEach(function(p,j){p.setAttribute("opacity", j===i? "0":String(INACT));});
    if(it.h){
      handles.style.display="";
      var c1x=xAt(it.h[0]),c1y=yAt(it.h[1]),c2x=xAt(it.h[2]),c2y=yAt(it.h[3]);
      h1line.setAttribute("x1",X0);h1line.setAttribute("y1",Y0);h1line.setAttribute("x2",c1x);h1line.setAttribute("y2",c1y);
      h2line.setAttribute("x1",X1);h2line.setAttribute("y1",yAt(1));h2line.setAttribute("x2",c2x);h2line.setAttribute("y2",c2y);
      h1dot.setAttribute("cx",c1x);h1dot.setAttribute("cy",c1y);
      h2dot.setAttribute("cx",c2x);h2dot.setAttribute("cy",c2y);
    }else handles.style.display="none";
    if(showcap){ buildCaption(it); cap.style.opacity=1; }
  }

  function placeOrb(t){
    var v=INTENTS[idx].ease(t), px=xAt(t), py=yAt(v);
    orb.setAttribute("cx",px);orb.setAttribute("cy",py);
    orbGlow.setAttribute("cx",px);orbGlow.setAttribute("cy",py);
    crossV.setAttribute("x1",px);crossV.setAttribute("x2",px);crossV.setAttribute("y1",Y0);crossV.setAttribute("y2",py);
    crossH.setAttribute("x1",X0);crossH.setAttribute("x2",px);crossH.setAttribute("y1",py);crossH.setAttribute("y2",py);
    return {px:px,py:py};
  }

  // ---- reduced motion: a CALM opacity-only loop (not a freeze) ---------
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  var idx=0;
  if(reduce){
    trailC.forEach(function(c){c.style.opacity=0;});
    chip.style.opacity=0;
    curve.style.transition=curveGlow.style.transition="opacity .8s ease";
    orb.style.transition=orbGlow.style.transition=cross.style.transition="opacity .8s ease";
    var showCalm=function(i){
      applyIntent(INTENTS[i],i);
      curve.style.strokeDashoffset="0"; curveGlow.style.strokeDashoffset="0";
      placeOrb(1);
      curve.style.opacity=curveGlow.style.opacity=orb.style.opacity=orbGlow.style.opacity=1;
      cross.style.opacity=".4"; handles.style.opacity=INTENTS[i].h?".85":0;
    };
    var last=null, CALM=3200, FADE=800;
    var calm=function(now){
      if(last===null){ last=now; showCalm(idx); }
      else if(now-last>=CALM){
        last=now;
        curve.style.opacity=curveGlow.style.opacity=orb.style.opacity=orbGlow.style.opacity=0;
        cross.style.opacity=0; handles.style.opacity=0;
        setTimeout(function(){ idx=(idx+1)%INTENTS.length; showCalm(idx); }, FADE);
      }
      requestAnimationFrame(calm);
    };
    requestAnimationFrame(calm);
    return;
  }

  // ---- animation loop --------------------------------------------------
  var SLOT=3600, DRAW=600, RIDE_IN=980;
  var t0=null, lastChipX=X0, tGlobal=0;

  function frame(now){
    if(t0===null){ t0=now; applyIntent(INTENTS[idx],idx); }
    var e=now-t0;
    if(e>=SLOT){ t0=now; idx=(idx+1)%INTENTS.length; applyIntent(INTENTS[idx],idx); e=0; lastChipX=X0; }
    var it=INTENTS[idx];
    tGlobal+=1;

    var dp=Math.min(1,e/DRAW), dEase=1-Math.pow(1-dp,3), off=(it.len*(1-dEase)).toFixed(2);
    curve.style.strokeDashoffset=off; curveGlow.style.strokeDashoffset=off;
    handles.style.opacity=(it.h?dEase*.9:0).toString();

    washRect.style.opacity=(0.85+0.15*Math.sin(tGlobal/42)).toFixed(3);

    var rideEnd=RIDE_IN+it.dur, visible=e>=RIDE_IN-40;
    orb.style.opacity=orbGlow.style.opacity=visible?1:0;
    cross.style.opacity=visible?".6":0;
    var p = e<RIDE_IN?placeOrb(0) : e<rideEnd?placeOrb((e-RIDE_IN)/it.dur) : placeOrb(1);

    hist.unshift({x:p.px,y:p.py}); if(hist.length>TRAILN) hist.pop();
    var moving=e>=RIDE_IN&&e<rideEnd;
    for(var i=0;i<TRAILN;i++){
      var h=hist[i], c=trailC[i];
      if(h&&moving){
        c.setAttribute("cx",h.x);c.setAttribute("cy",h.y);
        c.setAttribute("r",(3*(1-i/TRAILN)).toFixed(2));
        c.setAttribute("fill",it.color);
        c.style.opacity=(0.5*(1-i/TRAILN)).toFixed(3);
      }else c.style.opacity=0;
    }

    // demo chip: LEFT EDGE = X0 at start, RIGHT EDGE = X1 at stop (clamped within
    // the track so spring/anticipate overshoot never spills past the ends)
    var cp = e<RIDE_IN?0 : e<rideEnd?(e-RIDE_IN)/it.dur : 1;
    var chipX=Math.max(X0,Math.min(X1-CHIPW, X0+it.ease(cp)*(W-CHIPW)));
    var vel=Math.abs(chipX-lastChipX); lastChipX=chipX;
    chip.setAttribute("x",chipX); chip.setAttribute("fill",it.color);
    mblurG.setAttribute("stdDeviation",Math.min(8,vel*1.7).toFixed(2)+" 0");

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
