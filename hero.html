<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadence — hero</title>
<meta name="description" content="A self-contained, text-free hero animation showcasing Cadence: the whole motion system as a fan of role-coloured easing curves, one lit at a time, with an orb riding the active one." />
<!--
  Cadence — standalone hero animation (text-free).

  ONE file, ZERO dependencies, no external requests at runtime — true to the
  product's own thesis ("one static page, no framework, no runtime"). Built to
  stand on its own VISUALLY: drop it in a portfolio hero band, <iframe> it, or
  lift the markup. The surrounding page carries the words; this carries the motion.

  What it shows (the tool's CORE, wordlessly): the whole motion system at once —
  the four semantic intents (enter · move · emphasized · exit) drawn as a fan of
  role-coloured easing curves. One lights up at a time; an orb rides that exact
  curve (comet trail + velocity-driven motion blur on a demo chip), a soft wash
  of its role colour breathes behind it, and springs are sampled to a linear()
  polyline just as Cadence exports them. So the shape you read is the motion you
  feel, and the colour tells you which token you're looking at.

  Modes (via URL hash):
    • default   — text-free visual, full-bleed
    • #label    — reveal a minimal mono instrument caption (intent + curve value)

  prefers-reduced-motion renders a single calm static frame (the whole fan, enter lit).

  Palette is Cadence's own: bg #191712, and the four role colours
  (enter #8ad0c6 · move #e9b872 · emphasized #b79cf0 · exit #e08b7f).
-->
<style>
  :root{
    --bg:#191712;
    --faint:#6c6656;
    --line:rgba(236,229,214,.09);
    --line-2:rgba(236,229,214,.05);
    --enter:#8ad0c6; --move:#e9b872; --emphasized:#b79cf0; --exit:#e08b7f;
    /* --role is swapped per intent by the driver; seed with enter */
    --role:#8ad0c6;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:#ece5d6;
    min-height:100svh;
    display:grid;
    place-items:stretch;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100%;
    min-height:100svh;
    /* a soft vignette to seat the composition in the dark */
    background:radial-gradient(120% 100% at 50% 42%,rgba(236,229,214,.03),transparent 60%);
    overflow:hidden;
  }
  .stage svg.plot{
    position:absolute;inset:0;
    width:100%;height:100%;
    display:block;
  }

  /* minimal instrument caption — hidden unless #label is set */
  .cap{
    position:absolute;left:clamp(18px,4vw,44px);bottom:clamp(18px,4vw,40px);
    font-family:var(--mono);
    display:none;
    align-items:baseline;gap:12px;
    opacity:0;transform:translateY(6px);
  }
  body.showcap .cap{display:flex}
  body.showcap.capin .cap{opacity:1;transform:none;transition:opacity .45s ease,transform .45s cubic-bezier(.22,1,.36,1)}
  .cap__intent{
    font-size:1rem;font-weight:600;color:var(--role);
    padding:4px 11px;border-radius:8px;
    border:1px solid color-mix(in oklab,var(--role) 45%,transparent);
    background:color-mix(in oklab,var(--role) 12%,transparent);
    transition:color .45s ease,border-color .45s ease,background .45s ease;
  }
  .cap__val{font-size:.8rem;color:var(--faint);letter-spacing:.02em}

  @media (prefers-reduced-motion:reduce){
    .cap{transition:none}
  }
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <svg class="plot" viewBox="0 -30 320 230" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- velocity-driven horizontal motion blur for the demo chip -->
      <filter id="mblur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur id="mblurG" stdDeviation="0 0" />
      </filter>
      <!-- soft bloom for the active curve -->
      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3.4" />
      </filter>
      <radialGradient id="orbGlow">
        <stop offset="0%" stop-color="var(--role)" stop-opacity=".6"/>
        <stop offset="100%" stop-color="var(--role)" stop-opacity="0"/>
      </radialGradient>
      <!-- background colour wash — takes the active role colour -->
      <radialGradient id="wash" cx="50%" cy="46%" r="60%">
        <stop offset="0%" stop-color="var(--role)" stop-opacity=".16"/>
        <stop offset="55%" stop-color="var(--role)" stop-opacity=".04"/>
        <stop offset="100%" stop-color="var(--role)" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- breathing colour wash -->
    <rect id="washRect" x="0" y="-30" width="320" height="230" fill="url(#wash)"/>

    <!-- faint grid + frame -->
    <g stroke="var(--line-2)" fill="none" stroke-width="1">
      <line x1="40" y1="162" x2="280" y2="162"/>
      <line x1="40" y1="42"  x2="40"  y2="162"/>
    </g>
    <g stroke="var(--line-2)" fill="none" stroke-width="1" stroke-dasharray="2 5">
      <line x1="40" y1="102" x2="280" y2="102"/>
      <line x1="160" y1="42" x2="160" y2="162"/>
    </g>

    <!-- the whole system: a fan of the four role-coloured intents (filled by JS) -->
    <g id="fan" fill="none" stroke-width="1.6" stroke-linecap="round"></g>

    <!-- background demo track -->
    <line x1="40" y1="180" x2="280" y2="180" stroke="var(--line-2)" stroke-width="1"/>

    <!-- crosshair, reading the active curve at time t -->
    <g id="cross" stroke="var(--role)" stroke-width="1" opacity="0" stroke-dasharray="1 3">
      <line id="crossV" x1="40" y1="162" x2="40" y2="162"/>
      <line id="crossH" x1="40" y1="162" x2="40" y2="162"/>
    </g>

    <!-- control-point handles (cubic intents only) -->
    <g id="handles" opacity="0">
      <line id="h1line" stroke="var(--role)" stroke-width="1" opacity=".5"/>
      <line id="h2line" stroke="var(--role)" stroke-width="1" opacity=".5"/>
      <circle id="h1dot" r="2.6" fill="var(--bg)" stroke="var(--role)" stroke-width="1.4"/>
      <circle id="h2dot" r="2.6" fill="var(--bg)" stroke="var(--role)" stroke-width="1.4"/>
    </g>

    <!-- the ACTIVE curve: a bloomed underlay + a crisp stroke on top -->
    <path id="curveGlow" fill="none" stroke="var(--role)" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round" opacity=".22" filter="url(#bloom)"/>
    <path id="curve" fill="none" stroke="var(--role)" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- demo chip: translates with the SAME easing, smeared by its velocity -->
    <g filter="url(#mblur)">
      <rect id="chip" x="34" y="174" width="12" height="12" rx="3" fill="var(--role)"/>
    </g>

    <!-- orb + comet trail (trail circles created by JS) -->
    <g id="trail"></g>
    <circle id="orbGlowC" r="12" fill="url(#orbGlow)"/>
    <circle id="orb" r="4.6" fill="var(--role)"/>

    <!-- endpoint anchors -->
    <circle cx="40" cy="162" r="2.1" fill="var(--faint)"/>
    <circle cx="280" cy="42" r="2.1" fill="var(--faint)"/>
  </svg>

  <div class="cap" id="cap">
    <span class="cap__intent" id="capIntent">enter</span>
    <span class="cap__val" id="capVal"></span>
  </div>
</div>

<script>
(function(){
  "use strict";
  var NS="http://www.w3.org/2000/svg", $=function(id){return document.getElementById(id)};

  // #label reveals the minimal instrument caption; default is text-free
  if(/label/.test(location.hash)) document.body.classList.add("showcap");

  // ---- plot geometry (SVG user units) ---------------------------------
  var X0=40, X1=280, W=X1-X0, Y0=162, H=120;
  var xAt=function(t){return X0+t*W}, yAt=function(v){return Y0-v*H};

  // ---- easing maths ----------------------------------------------------
  function cubic(x1,y1,x2,y2){
    var bx=function(s){return 3*(1-s)*(1-s)*s*x1+3*(1-s)*s*s*x2+s*s*s;};
    var by=function(s){return 3*(1-s)*(1-s)*s*y1+3*(1-s)*s*s*y2+s*s*s;};
    return function(t){var lo=0,hi=1,s=t;for(var i=0;i<22;i++){s=(lo+hi)/2;(bx(s)<t)?lo=s:hi=s;}return by(s);};
  }
  function spring(k,c){ // damped oscillator, 0→1, sampled to a polyline (→ linear())
    var m=1, w0=Math.sqrt(k/m), zeta=c/(2*Math.sqrt(k*m)), WIN=0.92;
    var wd=w0*Math.sqrt(Math.max(1e-6,1-zeta*zeta));
    return function(t){var tt=t*WIN;
      if(zeta<1){return 1-Math.exp(-zeta*w0*tt)*(Math.cos(wd*tt)+(zeta*w0/wd)*Math.sin(wd*tt));}
      return 1-Math.exp(-w0*tt)*(1+w0*tt);};
  }

  var INTENTS=[
    {key:"enter", color:"#8ad0c6", val:"cubic-bezier(.05,.7,.1,1)", dur:280, ease:cubic(.05,.7,.1,1), h:[.05,.7,.1,1]},
    {key:"move", color:"#e9b872", val:"cubic-bezier(.4,0,.2,1)", dur:320, ease:cubic(.4,0,.2,1), h:[.4,0,.2,1]},
    {key:"emphasized", color:"#b79cf0", val:"cubic-bezier(.34,1.56,.64,1)", dur:360, ease:cubic(.34,1.56,.64,1), h:[.34,1.56,.64,1]},
    {key:"exit", color:"#e08b7f", val:"spring(stiffness 200 · damping 14)", dur:640, ease:spring(200,14), h:null}
  ];

  // pre-sample each intent → path string + total length (for the draw-on)
  var N=72;
  INTENTS.forEach(function(it){
    var d="", len=0, ppx, ppy;
    for(var i=0;i<=N;i++){
      var t=i/N, px=xAt(t), py=yAt(it.ease(t));
      d+=(i?"L":"M")+px.toFixed(2)+","+py.toFixed(2);
      if(i) len+=Math.hypot(px-ppx,py-ppy);
      ppx=px; ppy=py;
    }
    it.d=d; it.len=len;
  });

  // ---- the fan: all four intents, faintly, always present -------------
  var fan=$("fan"), fanPaths=[];
  INTENTS.forEach(function(it){
    var p=document.createElementNS(NS,"path");
    p.setAttribute("d",it.d); p.setAttribute("stroke",it.color); p.setAttribute("opacity",".14");
    fan.appendChild(p); fanPaths.push(p);
  });

  // ---- DOM handles -----------------------------------------------------
  var curve=$("curve"), curveGlow=$("curveGlow"), orb=$("orb"), orbGlow=$("orbGlowC"),
      chip=$("chip"), cross=$("cross"), crossV=$("crossV"), crossH=$("crossH"),
      handles=$("handles"), h1line=$("h1line"), h2line=$("h2line"), h1dot=$("h1dot"), h2dot=$("h2dot"),
      mblurG=$("mblurG"), washRect=$("washRect"), trail=$("trail"),
      cap=$("cap"), capIntent=$("capIntent"), capVal=$("capVal"), root=document.documentElement;

  var TRAILN=18, trailC=[], hist=[];
  for(var i=0;i<TRAILN;i++){var c=document.createElementNS(NS,"circle");c.setAttribute("r","3");trail.appendChild(c);trailC.push(c);}

  var CHIP_X0=34, CHIP_W=W;

  function applyIntent(it,i){
    root.style.setProperty("--role",it.color);
    curve.setAttribute("d",it.d); curveGlow.setAttribute("d",it.d);
    curve.style.strokeDasharray=it.len+" "+it.len;
    curveGlow.style.strokeDasharray=it.len+" "+it.len;
    // dim the whole fan, lift the active one
    fanPaths.forEach(function(p,j){p.setAttribute("opacity", j===i? "0":"0.12");});
    if(it.h){
      handles.style.display="";
      var c1x=xAt(it.h[0]),c1y=yAt(it.h[1]),c2x=xAt(it.h[2]),c2y=yAt(it.h[3]);
      h1line.setAttribute("x1",X0);h1line.setAttribute("y1",Y0);h1line.setAttribute("x2",c1x);h1line.setAttribute("y2",c1y);
      h2line.setAttribute("x1",X1);h2line.setAttribute("y1",yAt(1));h2line.setAttribute("x2",c2x);h2line.setAttribute("y2",c2y);
      h1dot.setAttribute("cx",c1x);h1dot.setAttribute("cy",c1y);
      h2dot.setAttribute("cx",c2x);h2dot.setAttribute("cy",c2y);
    }else handles.style.display="none";
    if(document.body.classList.contains("showcap")){
      capIntent.textContent=it.key; capVal.textContent=it.val;
      document.body.classList.remove("capin"); void cap.offsetWidth; document.body.classList.add("capin");
    }
  }

  function placeOrb(t){
    var v=INTENTS[idx].ease(t), px=xAt(t), py=yAt(v);
    orb.setAttribute("cx",px);orb.setAttribute("cy",py);
    orbGlow.setAttribute("cx",px);orbGlow.setAttribute("cy",py);
    crossV.setAttribute("x1",px);crossV.setAttribute("x2",px);crossV.setAttribute("y1",Y0);crossV.setAttribute("y2",py);
    crossH.setAttribute("x1",X0);crossH.setAttribute("x2",px);crossH.setAttribute("y1",py);crossH.setAttribute("y2",py);
    return {px:px,py:py};
  }

  // ---- reduced motion: one calm static frame --------------------------
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
  var idx=0;
  if(reduce){
    applyIntent(INTENTS[0],0);
    curve.style.strokeDashoffset="0"; curveGlow.style.strokeDashoffset="0";
    placeOrb(1); orb.style.opacity=orbGlow.style.opacity=1;
    cross.style.opacity=".55"; handles.style.opacity=".85";
    chip.setAttribute("x",CHIP_X0+INTENTS[0].ease(1)*CHIP_W-6);
    if(document.body.classList.contains("showcap")) document.body.classList.add("capin");
    return;
  }

  // ---- animation loop --------------------------------------------------
  var SLOT=3600, DRAW=600, RIDE_IN=980;
  var t0=null, lastChipX=CHIP_X0, tGlobal=0;

  function frame(now){
    if(t0===null){ t0=now; applyIntent(INTENTS[idx],idx); }
    var e=now-t0;
    if(e>=SLOT){ t0=now; idx=(idx+1)%INTENTS.length; applyIntent(INTENTS[idx],idx); e=0; lastChipX=CHIP_X0; }
    var it=INTENTS[idx];
    tGlobal+=1;

    // curve draw-on (ease-out)
    var dp=Math.min(1,e/DRAW), dEase=1-Math.pow(1-dp,3), off=(it.len*(1-dEase)).toFixed(2);
    curve.style.strokeDashoffset=off; curveGlow.style.strokeDashoffset=off;
    handles.style.opacity=(it.h?dEase*.9:0).toString();

    // gentle breathing on the wash so the frame is alive even at rest
    washRect.style.opacity=(0.85+0.15*Math.sin(tGlobal/42)).toFixed(3);

    // orb ride
    var rideEnd=RIDE_IN+it.dur, visible=e>=RIDE_IN-40;
    orb.style.opacity=orbGlow.style.opacity=visible?1:0;
    cross.style.opacity=visible?".6":0;
    var p = e<RIDE_IN?placeOrb(0) : e<rideEnd?placeOrb((e-RIDE_IN)/it.dur) : placeOrb(1);

    // comet trail (while moving)
    hist.unshift({x:p.px,y:p.py}); if(hist.length>TRAILN) hist.pop();
    var moving=e>=RIDE_IN&&e<rideEnd;
    for(var i=0;i<TRAILN;i++){
      var h=hist[i], c=trailC[i];
      if(h&&moving){
        c.setAttribute("cx",h.x);c.setAttribute("cy",h.y);
        c.setAttribute("r",(3.6*(1-i/TRAILN)).toFixed(2));
        c.setAttribute("fill",it.color);
        c.style.opacity=(0.5*(1-i/TRAILN)).toFixed(3);
      }else c.style.opacity=0;
    }

    // demo chip: same easing, blurred by velocity
    var cp = e<RIDE_IN?0 : e<rideEnd?(e-RIDE_IN)/it.dur : 1;
    var chipX=CHIP_X0+it.ease(cp)*CHIP_W-6, vel=Math.abs(chipX-lastChipX); lastChipX=chipX;
    chip.setAttribute("x",chipX); chip.setAttribute("fill",it.color);
    mblurG.setAttribute("stdDeviation",Math.min(9,vel*1.6).toFixed(2)+" 0");

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
