<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Cadence — not found</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<!-- share the site's tokens, fonts and light/dark handling so 404 is the same product -->
<link rel="stylesheet" href="/styles.css" />
<style>
/* 404-only layout; every colour and typeface comes from the shared tokens above */
body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);color:var(--ink)}
.nf{max-width:420px}
.nf__mark{width:44px;height:44px;margin:0 auto 22px;display:block}
.nf__code{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px}
.nf h1{font-family:var(--serif);font-size:27px;line-height:1.15;font-weight:560;margin:0 0 12px;color:var(--ink)}
.nf p{color:var(--ink-dim);margin:0 0 26px}
.nf__home{display:inline-block;font-family:var(--mono);font-size:13px;text-decoration:none;color:var(--bg);
  background:var(--accent);border-radius:9px;padding:9px 16px;font-weight:600;
  transition:transform .2s cubic-bezier(.22,1,.36,1),filter .2s ease}
.nf__home:hover{transform:translateY(-1px);filter:brightness(1.08)}
@media (prefers-reduced-motion:reduce){.nf__home{transition:none}}
</style>
</head>
<body>
<div class="nf">
  <img class="nf__mark" src="/favicon.svg" alt="" width="44" height="44" />
  <p class="nf__code">Error · 404</p>
  <h1>This page isn’t part of the system</h1>
  <p>The scale you’re looking for doesn’t resolve here. Head back and compose one.</p>
  <a class="nf__home" href="/">back to cadence</a>
</div>
</body>
</html>
